var aaGeoReady=fetch('https://ipapi.co/json/').then(function(r){return r.json();}).then(function(g){aaGeo=g;}).catch(function(){});
var u=function(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0);});};
async function unlock(pw){
 var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(AA_ENC.s),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(AA_ENC.i)},key,u(AA_ENC.c)));
}
